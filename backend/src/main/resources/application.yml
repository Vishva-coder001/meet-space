spring:
  application:
    name: meetspace-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  sql:
    init:
      mode: never
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
meetspace:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  security:
    cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
    verification-token-hours: ${VERIFICATION_TOKEN_HOURS:24}
    reset-token-minutes: ${RESET_TOKEN_MINUTES:30}

logging:
  level:
    com.meetspace: ${MEETSPACE_LOG_LEVEL:INFO}
    org.springframework.jdbc: ${JDBC_LOG_LEVEL:WARN}
